name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      # 运维/CI 自身改动不重建应用镜像（2026-11-09）。scripts/ 仅含宿主机运维脚本，
      # 容器运行时不引用（镜像内副本无入口）；.github/ 只影响流水线。否则一次磁盘
      # 清理策略的提交会白白触发 3.7GB 跨境重建 + 部署。若 scripts/ 以后被运行时代码
      # 引用，必须先删除这里的 ignore 规则。
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0.0)'
        required: true
        default: 'latest'
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# 镜像名单事实源（2026-11-10 根修）：仓库从 xianyu-auto-bot 改名 xianyu-bot 后，
# metadata-action 的 `github.event.repository.name` 变成 xianyu-bot，而部署 helper
# 与宿主机 compose 仍指向 xianyu-auto-bot —— 构建推新包、部署拉旧包，deploy job
# 每次都"绿"但线上永远停在 10-31 的旧镜像（slidex 0.6.42）。镜像名统一由这里
# 一处决定，构建（metadata images）与部署（helper REPO）都引用它，杜绝再次分叉。
env:
  REPO_IMAGE: ghcr.io/dengyie/xianyu-auto-bot

jobs:
  # 部署门禁：此前 push main 时 Test 与本 workflow 并行、互不依赖，
  # 测试失败照样构建部署；现把 pytest 纳入 needs 链。
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PATH: ':memory:'
      SQL_LOG_ENABLED: 'false'
      XY_SLIDER_DRISSION_FALLBACK: 'false'
      XY_SLIDER_REMOTE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create virtual environment
        run: |
          uv venv .venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify dependency lock
        # Test workflow 也有此校验；部署链不能假定它跑过（fail 的 Test 不阻断本 job）
        run: |
          uv pip compile requirements.txt \
            --python-version 3.11 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --no-emit-package slidex \
            --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python --require-hashes -r requirements.lock
          # slidex 单一事实源 = requirements.txt（禁止再硬编码 commit，防三处 pin 漂移）
          SLIDEX_REQ=$(grep -E '^slidex[[:space:]]*@' requirements.txt | head -1)
          echo "slidex requirement: $SLIDEX_REQ"
          uv pip install --python .venv/bin/python --no-deps "$SLIDEX_REQ"

      - name: Prepare runtime directories
        run: mkdir -p logs data backups static/uploads/images trajectory_history

      - name: Run test suite
        run: |
          set -o pipefail
          timeout --signal=KILL 480 python -m pytest -q --tb=line

      - name: Undefined-name guard (pyflakes F821)
        run: |
          uv pip install --python .venv/bin/python --quiet pyflakes
          if python -m pyflakes *.py utils/*.py db_manager/*.py app/*.py app/api/*.py app/api/routers/*.py app/application/*/*.py app/domain/*/*.py | grep "undefined name"; then
            echo "::error::undefined names detected (F821)"
            exit 1
          fi

  build-and-push:
    needs: pytest
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名统一引用工作流级 REPO_IMAGE（不要再用 repository.name，
          # 仓库改名会让它和部署侧分叉——见顶部 env 注释）
          images: ${{ env.REPO_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }},format=short

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # 缓存策略（2026-10-14 加固）：仅靠 type=gha 会因 10GB/7天限额被逐出，
          # 逐出后 apt+Playwright 浏览器层（~600MB）每次重建都会产生**新 digest**，
          # 于是 VPS 每次都要跨境重下这一整层——单个 600MB 层在跨境链路上几乎不可能
          # 一次拉完（overlay2 不回续传，失败即从 0 重来）。改为 GHCR 持久缓存 +
          # 以 VPS 已部署镜像为种子，令重建复用同一批层，VPS 只需下变化的应用层。
          # `sha-de8805d` 是种子：指向线上当前镜像，保证本次重建与该镜像层一致。
          # 缓存 ref 同样只用 REPO_IMAGE（2026-11-11 补齐）：改名后这里若仍取
          # repository.name，会指向 xianyu-bot 这个空包——每次构建缓存全未命中，
          # apt+Playwright 层整层重下，正是本段注释要防的失效场景。
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REPO_IMAGE }}:buildcache
            type=registry,ref=${{ env.REPO_IMAGE }}:sha-de8805d
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REPO_IMAGE }}:buildcache,mode=max

  deploy-to-tencent:
    # 镜像构建成功后自动部署到腾讯轻量云生产（push to main 自动）；
    # workflow_dispatch 提供手动重部署入口（.github/** 在 paths-ignore 里，
    # 纯 CI 修复不会自动触发，手动 dispatch 是刻意留的逃生口）
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-and-push
    runs-on: ubuntu-latest
    # 跨境 pull 实测单次可达 ~25 分钟；30 分钟上限曾连续 3 轮被取消（1046c71）。
    # 60 分钟给足余量，配合下方 detached 拉取（重跑续传），杜绝超时取消。
    timeout-minutes: 60
    # 与 cleanup.yml 共用串行组：prune 与 pull 并发会撞 containerd ingest（2026-09-05 踩过）
    concurrency:
      group: tencent-docker-serial
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.XIANYU_DEPLOY_HOST }}
    steps:
      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XIANYU_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install compose file on host (single source of truth)
        # 宿主机 /opt/xianyu-auto-bot/docker-compose.yml 原先是一份手工维护的副本，
        # 与仓库脱钩：2026-11-11 它还挂着 2026-09-29 的 api_captcha_remote.py /
        # captcha_control.html（新镜像 + 旧挂载），而 revision 校验与健康检查只看
        # 镜像和容器，看不见 compose 本身。此后仓库这份文件是唯一事实源。
        #   1) 先 docker compose config 校验（项目目录不变，宿主机 .env 照常解析）；
        #   2) /app 下只允许 ALLOWED 这 6 个数据/配置目标——白名单而非
        #      "*.py|html 后缀黑名单"：`.:/app`、`/app/<dir>`、`/app/x.json` 都
        #      不满足后缀判据，却同样能盖住镜像内容；
        #   3) 传回的字节必须与 runner 上 checkout 出来的文件逐字节一致，不一致就
        #      不动宿主机文件。注意**不能用 hashFiles()**：它对「文件集合（路径+内容）」
        #      求哈希，不是单文件 sha256，首版用它导致误判（2026-11-11 首次部署实测
        #      d41fb9cc… != 90d3f1df…，闸门按设计拒绝覆盖、保留原文件）；
        #   4) 替换前把旧文件留档到 /var/tmp（只保留最近 5 份），并写
        #      /var/tmp/compose_swap.state 作为回滚凭证；job 后续任一步失败时
        #      "Roll back compose on failure" 把宿主机 compose 还原成本次运行之前的样子。
        # 本步骤被 paths-ignore 的 '.github/**' 排除，改动它不会触发构建——
        # 改完必须手工 `gh workflow run 282526695 --ref main` 验证一次。
        # 主机特定值（密钥、代理地址）仍在宿主机 .env，不随仓库走。
        run: |
          set -euo pipefail
          # checkout 必须干净，否则传过去的是工作区而非提交内容
          if [ -n "$(git status --porcelain -- docker-compose.yml)" ]; then
            echo "::error::docker-compose.yml 在 runner 上有未提交改动"
            exit 1
          fi
          LOCAL_SUM=$(sha256sum docker-compose.yml | awk '{print $1}')
          echo "repo compose sha256: $LOCAL_SUM"
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root $SSH_HOST"
          $SSH 'cat > /opt/xianyu-auto-bot/.docker-compose.next.yml' < docker-compose.yml
          $SSH "COMPOSE_SHA=$LOCAL_SUM RUN_ID=${{ github.run_id }} bash -s" <<'SYNC'
          set -euo pipefail
          cd /opt/xianyu-auto-bot
          NEXT=.docker-compose.next.yml
          if ! docker compose -f "$NEXT" config -q 2>/tmp/compose_check.err; then
            echo "::error::新 compose 校验失败，保留宿主机原文件"
            sed -n '1,20p' /tmp/compose_check.err || true
            rm -f "$NEXT"
            exit 1
          fi
          docker compose -f "$NEXT" config --format json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(v.get("target","")) for v in d["services"]["xianyu-app"].get("volumes",[])]' \
            > /tmp/compose_mounts.txt
          echo "compose mount targets:"; cat /tmp/compose_mounts.txt
          # 白名单：/app 与 /app/* 只准出现在 ALLOWED 里的目标（与
          # tests/unit/test_compose_no_source_mounts.py 的 ALLOWED_APP_TARGETS 同源，
          # 由 test_runtime_gate_uses_the_same_whitelist 钉住两边一致）。
          ALLOWED="/app/data /app/logs /app/global_config.yml /app/backups /app/static/uploads /app/trajectory_history"
          BAD=""
          while read -r target; do
            case "$target" in
              /app | /app/*)
                case " $ALLOWED " in
                  *" $target "*) ;;
                  *) BAD="$BAD $target" ;;
                esac
                ;;
            esac
          done < /tmp/compose_mounts.txt
          if [ -n "$BAD" ]; then
            echo "::error::compose 在 /app 下挂了白名单之外的目标（新镜像 + 旧挂载）：$BAD"
            rm -f "$NEXT"
            exit 1
          fi
          NEW_SUM=$(sha256sum "$NEXT" | awk '{print $1}')
          if [ "$NEW_SUM" != "$COMPOSE_SHA" ]; then
            echo "::error::传输后的 compose 与仓库不一致（$NEW_SUM != ${COMPOSE_SHA}）"
            rm -f "$NEXT"
            exit 1
          fi
          # 同目录 mv = rename(2)，原子替换：读者要么看到旧文件、要么看到新文件，
          # 不会看到半截 YAML（install 是原地 O_TRUNC 写，中途断连会留下坏文件，
          # 后续所有 docker compose 调用连 pull 都起不来）。
          chmod 664 "$NEXT"
          # 用 compose 自己解析出的 user（${APP_UID:-1000}:${APP_GID:-1000}）而不是写死
          # 1000:1000：宿主机 .env 改了 APP_UID 后，compose 文件不至于变成别人的文件。
          OWNER=$(docker compose -f "$NEXT" config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["xianyu-app"].get("user") or "1000:1000")')
          chown "$OWNER" "$NEXT" 2>/dev/null || true
          if cmp -s "$NEXT" docker-compose.yml; then
            echo "compose already in sync ($NEW_SUM)"
            rm -f "$NEXT"
            rm -f /var/tmp/compose_swap.state
          else
            # 回滚凭证：写状态文件记下"替换前是什么"，job 后续任一步失败时由
            # "Roll back compose on failure" 还原。用状态文件而不是 ls 猜最新备份，
            # 并用 run id 认领——否则本次在安装前就失败时，会把上一次部署的备份
            # 当成自己的回滚目标，等于无谓降级。
            {
              echo "run=$RUN_ID"
              if [ -f docker-compose.yml ]; then
                BAK="/var/tmp/docker-compose.yml.bak.$(date +%Y%m%d-%H%M%S)"
                cp -p docker-compose.yml "$BAK"
                echo "backup=$BAK"
              fi
            } > /var/tmp/compose_swap.state
            mv -f "$NEXT" docker-compose.yml
            echo "compose updated -> $(sha256sum docker-compose.yml | awk '{print $1}')"
          fi
          ls -1t /var/tmp/docker-compose.yml.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f || true
          SYNC

      - name: Start pull on tencent (detached)
        # 跨境链路直连 GHCR 实测仅 0.3–3 MB/s:当 apt+Playwright 层(~600MB)digest 变化
        # (Dockerfile 改动 / 构建缓存失效)时,单层需 3–30+ 分钟且频繁 EOF 断流(overlay2
        # 大层失败即回退,曾连续判红)。改用 NJU 反代 ghcr.nju.edu.cn——与 GHCR 字节一致
        # (同 manifest digest,已验证),实测 ~3.7 MB/s,616MB 层 ~3 分钟。策略:先用镜像
        # 拉本次提交的 sha-<short> 标签,回打成 ghcr.io/<repo>:latest(compose 引用的名字);
        # 镜像不可达时回退直连 compose pull。仍用 setsid 解耦 SSH:重跑 job 复用仍在跑的
        # pull,不重复抢 containerd ingest 锁。
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" "SHORT_SHA=${{ github.sha }} REPO_IMAGE=${{ env.REPO_IMAGE }} bash -s" << 'DEPLOY_SCRIPT'
          set -euo pipefail
          LOG=/tmp/xianyu_pull.log
          EXITF=/tmp/xianyu_pull.exit
          HELPER=/tmp/xianyu_pull_helper.sh
          SHORT="${SHORT_SHA:0:7}"
          cat > "$HELPER" <<'HELPER_EOF'
          #!/usr/bin/env bash
          SHORT="$1"
          EXPECT_REV="$2"
          # 镜像名单源：与构建 metadata `images` 同源（工作流级 env.REPO_IMAGE），
          # 千万不要写死或改用 repository.name —— 2026-11-10 分叉事故的根因。
          REPO="${REPO_IMAGE#ghcr.io/}"
          # 镜像源按序尝试：2026-11-11 事故——nju 反代单源在 616MB 层上掉到 ~12KB/s，
          # 20 分钟超时后直连 GHCR 又反复 EOF，整次部署判红。1ms 同层实测可完成，
          # 故做成列表而非单点，任一源 revision 校验通过即止。
          MIRRORS="${XIANYU_PULL_MIRRORS:-ghcr.nju.edu.cn ghcr.1ms.run}"
          LOG=/tmp/xianyu_pull.log
          EXITF=/tmp/xianyu_pull.exit
          echo "=== pull start $(date) short=$SHORT repo=$REPO expect_rev=$EXPECT_REV mirrors=$MIRRORS ===" > "$LOG"
          rc=1
          for MIRROR in $MIRRORS; do
            echo "--- mirror path: $MIRROR/$REPO:sha-$SHORT ---" >> "$LOG"
            timeout 1200 sudo docker pull "$MIRROR/$REPO:sha-$SHORT" >>"$LOG" 2>&1 || continue
            got_rev=$(sudo docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$MIRROR/$REPO:sha-$SHORT" 2>/dev/null || echo "")
            echo "--- mirror image revision=$got_rev expected=$EXPECT_REV ---" >> "$LOG"
            if [ "$got_rev" = "$EXPECT_REV" ]; then
              if sudo docker tag "$MIRROR/$REPO:sha-$SHORT" "ghcr.io/$REPO:latest" >>"$LOG" 2>&1 \
                 && sudo docker tag "$MIRROR/$REPO:sha-$SHORT" "ghcr.io/$REPO:sha-$SHORT" >>"$LOG" 2>&1; then
                rc=0
                break
              fi
            else
              echo "--- mirror revision mismatch (stale/lagging mirror); refusing tag ---" >> "$LOG"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "--- mirror path failed; fallback: direct GHCR compose pull ---" >> "$LOG"
            sudo docker compose -f /opt/xianyu-auto-bot/docker-compose.yml pull xianyu-app >>"$LOG" 2>&1 && rc=0
          fi
          echo "EXIT=$rc" > "$EXITF"
          HELPER_EOF
          chmod +x "$HELPER"
          if pgrep -f 'xianyu_pull_helper' >/dev/null || pgrep -f 'compose .*pull xianyu-app' >/dev/null; then
            echo "an in-flight pull already exists — will poll it instead of starting a new one"
          else
            rm -f "$EXITF"
            setsid nohup "$HELPER" "$SHORT" "$SHORT_SHA" </dev/null >/dev/null 2>&1 &
            echo "detached pull started (mirror-first, log: $LOG)"
          fi
          DEPLOY_SCRIPT

      - name: Wait for pull to complete
        # 轮询 detached 拉取的退出码标记文件，每 ~15s 探一次，上限 ~50 分钟
        # （200×15s，始终小于 job 的 60 分钟 timeout）。
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root"
          for i in $(seq 1 200); do
            state=$($SSH "$SSH_HOST" 'if [ -f /tmp/xianyu_pull.exit ]; then cat /tmp/xianyu_pull.exit; else echo PULLING; fi')
            case "$state" in
              "EXIT=0")
                echo "pull succeeded (poll #$i)"
                exit 0 ;;
              EXIT=*)
                echo "::error::pull failed: $state"
                $SSH "$SSH_HOST" 'tail -40 /tmp/xianyu_pull.log' || true
                exit 1 ;;
              *)
                if [ $((i % 4)) -eq 0 ]; then
                  echo "still pulling (poll #$i)..."
                  $SSH "$SSH_HOST" 'tail -2 /tmp/xianyu_pull.log' || true
                fi ;;
            esac
            sleep 15
          done
          echo "::error::pull did not finish within ~50 minutes"
          exit 1

      - name: Verify deployed image revision
        # 防"绿但旧"（2026-11-10 事故）：pull 成功 ≠ 拉到了本次提交——镜像名分叉
        # 或镜像源滞后时，compose pull 会"成功"拉到 stale latest，健康检查照样绿。
        # 强制校验本地 latest 的 revision 标签 == 本次 commit sha，不符直接判红。
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
            "REPO_IMAGE=${{ env.REPO_IMAGE }} EXPECT=${{ github.sha }} bash -s" <<'GATE'
          set -euo pipefail
          GOT=$(sudo docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REPO_IMAGE:latest")
          echo "deployed revision=$GOT expected=$EXPECT"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::stale image: latest revision $GOT != $EXPECT (镜像名/镜像源分叉)"
            exit 1
          fi
          GATE

      - name: Recreate container on tencent
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
            'set -e; sudo docker compose -f /opt/xianyu-auto-bot/docker-compose.yml up -d --no-build --no-deps --force-recreate xianyu-app
             if [ -f /var/tmp/compose_swap.state ]; then echo "recreated=1" >> /var/tmp/compose_swap.state; fi'

      - name: Health check
        # 冷启动可能数分钟才 healthy，单次 sleep+curl 会误报红；
        # 循环探测至 healthy，5 分钟仍失败才判红。
        # -f：HTTP >=4xx 视为失败；grep：必须含 "status":"healthy"，防 5xx/降级响应误判
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
              'curl -fsS --noproxy "*" -m 5 http://127.0.0.1:9000/health' | grep -q '"status":"healthy"'; then
              echo "healthy after attempt $i"
              exit 0
            fi
            echo "attempt $i not healthy yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::health check failed after 5 minutes"
          exit 1

      - name: Verify no host file shadows image code
        # 防"新镜像 + 旧挂载"（2026-11-11 事故）：宿主机 compose 曾把 2026-09-29 的
        # api_captcha_remote.py / captcha_control.html 以只读层挂进 /app，覆盖镜像内
        # 新版文件——镜像 revision 校验通过、健康检查照样绿，但线上跑的是六周前代码
        # （/trajectory 的 400 几何闸门根本没上线）。这里两道闸：
        #   1) /app 与 /app/* 只准出现白名单里的数据/配置目标（判据与安装 compose 那
        #      一步、tests/unit/test_compose_no_source_mounts.py 完全一致：后缀黑名单
        #      只拦得住 "*.py|html 单文件"，`.:/app`、`/app/<dir>`、`/app/x.json` 全能过）；
        #   2) 关键文件在容器内与镜像内的 sha256 必须一致。
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
            "REPO_IMAGE=${{ env.REPO_IMAGE }} bash -s" <<'GATE'
          set -euo pipefail
          sudo docker inspect xianyu-auto-bot --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' > /tmp/mounts.txt
          echo "container mount destinations:"; cat /tmp/mounts.txt
          ALLOWED="/app/data /app/logs /app/global_config.yml /app/backups /app/static/uploads /app/trajectory_history"
          BAD=""
          while read -r target; do
            case "$target" in
              /app | /app/*)
                case " $ALLOWED " in
                  *" $target "*) ;;
                  *) BAD="$BAD $target" ;;
                esac
                ;;
            esac
          done < /tmp/mounts.txt
          if [ -n "$BAD" ]; then
            echo "::error::宿主机文件挂载覆盖了 /app 内白名单之外的目标（新镜像 + 旧代码）：$BAD"
            exit 1
          fi
          for f in api_captcha_remote.py captcha_control.html; do
            if sudo docker run --rm --entrypoint sh "$REPO_IMAGE:latest" -c "test -f /app/$f" 2>/dev/null; then
              IMG_SUM=$(sudo docker run --rm --entrypoint sha256sum "$REPO_IMAGE:latest" "/app/$f" | awk '{print $1}')
              RUN_SUM=$(sudo docker exec xianyu-auto-bot sha256sum "/app/$f" | awk '{print $1}')
              if [ "$IMG_SUM" != "$RUN_SUM" ]; then
                echo "::error::$f 在容器内（${RUN_SUM}）与镜像内（${IMG_SUM}）不一致——被挂载/旧文件覆盖"
                exit 1
              fi
              echo "$f sha256 matches image"
            fi
          done
          GATE


      - name: Roll back compose on failure
        # compose 必须在拉镜像/重建**之前**安装（重建容器读的就是这份文件，晚装就
        # 又回到"新镜像 + 旧挂载"），代价是中途失败会留下"新 compose + 旧容器"的
        # 半态。这里兜回：还原到本次运行之前的内容；只有容器已经按新 compose 重建
        # 过才顺带重建回去。回滚自身失败只降级为 warning——首个错误才是根因。
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
            "RUN_ID=${{ github.run_id }} bash -s" <<'ROLLBACK'
          set -u
          STATE=/var/tmp/compose_swap.state
          if [ ! -f "$STATE" ]; then
            echo "本次运行没有替换过 compose，无需回滚"
            exit 0
          fi
          OWNER=$(sed -n 's/^run=//p' "$STATE")
          if [ "$OWNER" != "${RUN_ID:-}" ]; then
            echo "compose_swap.state 属于 run=${OWNER}，不是本次运行（${RUN_ID}），跳过"
            exit 0
          fi
          BAK=$(sed -n 's/^backup=//p' "$STATE")
          RECREATED=0; grep -q '^recreated=1' "$STATE" && RECREATED=1
          cd /opt/xianyu-auto-bot || { echo "::warning::/opt/xianyu-auto-bot 不存在"; exit 0; }
          if [ -n "$BAK" ] && [ -f "$BAK" ]; then
            cp -p "$BAK" docker-compose.yml.restoring
            mv -f docker-compose.yml.restoring docker-compose.yml
            echo "compose restored from $BAK -> $(sha256sum docker-compose.yml | awk '{print $1}')"
          elif [ -n "$BAK" ]; then
            echo "::warning::回滚备份 $BAK 已不存在，保留当前 compose"
            rm -f "$STATE"
            exit 0
          else
            rm -f docker-compose.yml
            echo "compose removed（本次运行前宿主机没有这个文件）"
          fi
          rm -f "$STATE"
          if [ "$RECREATED" = 1 ] && [ -f docker-compose.yml ]; then
            sudo docker compose -f docker-compose.yml up -d --no-build --no-deps --force-recreate xianyu-app \
              || echo "::warning::回滚后重建容器失败，线上仍是新 compose 的挂载，需人工确认"
          fi
          ROLLBACK

      - name: Clear compose swap marker
        # 全绿 = compose 已被这次运行的内容验证通过，标记必须清掉：留着它，下一次
        # 运行若在安装前就失败，回滚步骤会误认领并还原一份旧文件（等于降级）。
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o User=root "$SSH_HOST" \
            'rm -f /var/tmp/compose_swap.state'
